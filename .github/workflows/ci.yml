name: CI

# Runs on every push/PR to dev and main. `main` is production — nothing
# merges into it without this workflow passing (enable "Require status
# checks to pass" -> select this workflow's jobs in GitHub's branch
# protection settings for `main`; that one step has to be done in GitHub's
# UI, it cannot be set from inside this file).
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install web dependencies
        run: npm install
        working-directory: apps/web

      - name: Install api dependencies
        run: npm install
        working-directory: apps/api

      - name: Build web
        run: npm run build
        working-directory: apps/web

      - name: Unit tests (web)
        run: npm test
        working-directory: apps/web

      - name: Syntax check (api + pocketbase hooks/migrations)
        run: |
          fail=0
          for f in $(find apps/api/src apps/pocketbase/pb_migrations apps/pocketbase/pb_hooks -name "*.js"); do
            node --check "$f" || fail=1
          done
          exit $fail

      # Uploaded so the smoke-test job below doesn't have to rebuild.
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  lint:
    name: Lint (non-blocking today)
    runs-on: ubuntu-latest
    # Advisory only until the existing lint backlog (if any) is cleared —
    # does not block merging to dev/main. Flip continue-on-error to false
    # once the project's lint output is clean, so it becomes a real gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm install
        working-directory: apps/web
      - run: npm install
        working-directory: apps/api
      - run: npm run lint

  smoke-test:
    name: Route / auth / database-connectivity checks
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install web dependencies
        run: npm install
        working-directory: apps/web

      - name: Install api dependencies
        run: npm install
        working-directory: apps/api

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Make PocketBase binary executable
        run: chmod +x apps/pocketbase/pocketbase

      - name: Run smoke test (boots the real server.cjs against a throwaway PocketBase data dir)
        run: bash scripts/smoke-test.sh

  responsive-smoke:
    name: Basic responsive checks (phone / tablet / desktop)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies (includes Playwright)
        run: npm install

      - name: Install web dependencies
        run: npm install
        working-directory: apps/web

      - name: Install api dependencies
        run: npm install
        working-directory: apps/api

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Make PocketBase binary executable
        run: chmod +x apps/pocketbase/pocketbase

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server (ephemeral PocketBase data)
        run: |
          export PB_ENCRYPTION_KEY="$(python3 -c 'import secrets,string;print("".join(secrets.choice(string.ascii_letters+string.digits) for _ in range(32)))')"
          export PB_SUPERUSER_EMAIL="ci-admin@example.com"
          export PB_SUPERUSER_PASSWORD="$(python3 -c 'import secrets;print(secrets.token_hex(12))')!"
          export PORT=4173
          # `export` only affects THIS step's own shell process — a later
          # step (Responsive smoke check, below) runs in a brand new shell
          # and never inherits it, which meant that check's own
          # PB_SUPERUSER_EMAIL/PASSWORD were always empty and it could never
          # actually log in to seed/drive the admin sidebar checks. Writing
          # to $GITHUB_ENV is what actually persists a var to every
          # subsequent step in this job.
          {
            echo "PB_SUPERUSER_EMAIL=$PB_SUPERUSER_EMAIL"
            echo "PB_SUPERUSER_PASSWORD=$PB_SUPERUSER_PASSWORD"
          } >> "$GITHUB_ENV"
          nohup node server.cjs > server.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/hcgi/platform/api/health || echo 000)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          cat server.log || true

      - name: Responsive smoke check
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/responsive-smoke.mjs
